
name: Build LeviControlMod

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # bisa trigger manual dari GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Install CMake
        run: sudo apt-get install -y cmake ninja-build

      - name: Configure
        run: |
          mkdir build
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -G Ninja

      - name: Build
        run: cmake --build build

      - name: Package
        run: |
          mkdir -p output/LeviControlMod
          cp build/libLeviControlMod.so output/LeviControlMod/
          cp manifest/manifest.json     output/LeviControlMod/
          zip -r LeviControlMod-release.zip output/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeviControlMod-release
          path: LeviControlMod-release.zip
          retention-days: 30
